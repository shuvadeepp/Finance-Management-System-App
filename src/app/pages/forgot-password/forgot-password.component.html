<div class="container mt-5">

  <div class="card shadow">

    <div class="card-header bg-primary text-white">

      Forgot Password

    </div>

    <div class="card-body">

      <input
        class="form-control mb-3"
        placeholder="User Name"
        [(ngModel)]="username">

      <button
        class="btn btn-primary"
        (click)="sendOtp()">

        Send OTP

      </button>

    </div>

  </div>

</div>
